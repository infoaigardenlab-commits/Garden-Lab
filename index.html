<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KSSTG2YXZZ"></script>

        window.dataLayer = window.dataLayer || [];

    <title>AI Garden Lab - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #4ade80;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            background: #22c55e;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            background: #86efac;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-30px) rotate(180deg);
            }
        }

        .container {
            text-align: center;
            z-index: 1;
            position: relative;
            padding: 40px;
            max-width: 800px;
            width: 90%;
        }

        .logo {
            font-size: 4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 1s ease-out;
        }

        .logo span {
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .coming-soon {
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 3px;
            animation: fadeInUp 1s ease-out 0.3s both;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
        }

        .description {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 50px;
            line-height: 1.8;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .domain {
            font-size: 1.5rem;
            color: #4ade80;
            font-weight: 600;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out 0.9s both;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }

        .notify-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out 1.2s both;
            flex-wrap: wrap;
        }

        .email-input {
            padding: 15px 25px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            min-width: 300px;
        }

        .email-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .email-input:focus {
            border-color: #4ade80;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }

        .notify-btn {
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4);
        }

        .notify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 222, 128, 0.6);
        }

        .notify-btn:active {
            transform: translateY(0);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            animation: fadeInUp 1s ease-out 1.5s both;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .social-link:hover {
            background: rgba(74, 222, 128, 0.3);
            border-color: #4ade80;
            transform: translateY(-5px);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .coming-soon {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .description {
                font-size: 1.1rem;
            }

            .domain {
                font-size: 1.2rem;
            }

            .email-input {
                min-width: 100%;
                margin-bottom: 10px;
            }

            .notify-btn {
                width: 100%;
            }

            .notify-form {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2rem;
            }

            .coming-soon {
                font-size: 1.5rem;
            }

            .description {
                font-size: 1rem;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="container">
        <h1 class="logo">AI <span>Garden</span> Lab</h1>
        <h2 class="coming-soon">COMING SOON</h2>
        <p class="description">
            We're cultivating something amazing! Our AI-powered garden lab is growing and will be ready to bloom soon.
        </p>
        <p class="domain">aigardenlab.com</p>

    <script>
        function handleNotify(event) {
            event.preventDefault();
            const email = event.target.querySelector('.email-input').value;
            alert(`Thank you! We'll notify you at ${email} when we launch.`);
            event.target.querySelector('.email-input').value = '';
        }
    </script>
